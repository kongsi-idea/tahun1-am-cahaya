<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1530">
  <title>光的小探险</title>
  <meta name="description" content="一年级 Alam dan Manusia 5.1：停电的晚上，用手电筒比较明暗，找出会自己发光的光源。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="一间停电的房子，可以用手电筒照"></canvas>

  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="brand-ic" id="brandIc"></span>
      <b>光的小探险</b>
      <span id="actLabel"></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" aria-label="关掉声音"></button>
      <button class="teacher-btn" id="teacherBtn">老师</button>
    </div>
  </header>
  <nav class="room-bar" id="roomBar" hidden aria-label="换房间"></nav>

  <section class="dock" id="dock" aria-live="polite"></section>
  <div class="modal" id="modal" hidden></div>

  <aside class="drawer" id="teacher" aria-hidden="true">
    <header><div><small>给老师</small><h2>课堂控制</h2></div><button class="icon-btn dark" id="teacherClose" aria-label="关闭">✕</button></header>
    <section>
      <h3>现在可以问</h3>
      <p class="prompt" id="promptText"></p>
    </section>
    <section>
      <h3>跳到</h3>
      <div class="jump-grid">
        <button data-jump="act1">第一幕：停电了</button>
        <button data-jump="compare">比一比明暗</button>
        <button data-jump="act2">第二幕：找亮东西</button>
        <button data-jump="blackout">全黑测验</button>
        <button data-jump="moon">月亮的秘密</button>
        <button data-jump="dawn">天亮了</button>
      </div>
    </section>
    <section class="row">
      <button id="pauseBtn">全班暂停</button>
      <button id="qualityBtn">画质：高</button>
    </section>
    <section class="note">
      <h3>使用须知</h3>
      <p>对应 KP2027《Alam dan Manusia》一年级 5.1.1–5.1.4。这是模拟，不能代替真的活动：课后请让学生在暗一点的地方，真的用手电筒照一照镜子和反光条。</p>
      <p>「全黑测验」是给一年级用的简单判断法：关掉别的光，还看得见的，才是自己会发光的。月亮在测验里还看得见，要用「月亮的秘密」带全班讨论。</p>
    </section>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="pause" id="pause" hidden><div><h2>请看老师</h2><p>点一下继续</p></div></div>
  <div class="loading" id="loading"><div class="spin"></div><p>正在准备房子……</p></div>

  <noscript>这个工具需要开启 JavaScript。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
